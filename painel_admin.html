<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>UnitvFree - Painel</title>
    <style>
     body { 
    background: linear-gradient(135deg, #0000FF, #800080); /* Azul e Roxo */
    min-height: 100vh; 
    margin: 0; 
    display: flex; /* Essencial para alinhar barra e conteúdo lado a lado */
    flex-direction: row; 
    color: white; 
    font-family: Arial, sans-serif; 
}

.sidebar {
    background-color: #0f1025;
    width: 250px;
    padding: 20px;
    display: flex;
    flex-direction: column;
}

.menu-item {
    padding: 15px;
    margin-bottom: 10px;
    border-radius: 12px;
    color: white;
    text-decoration: none;
    transition: background 0.3s;
}

/* Estilo para item selecionado */
.menu-item.active {
    background: linear-gradient(90deg, #1e3c72 0%, #a82020 100%);
}

.sidebar button:hover {
    background-color: #2e2e4e; /* Efeito ao passar o mouse */
}

.content { 
    flex: 1; /* Faz o conteúdo ocupar todo o espaço restante */
    padding: 40px; 
    overflow-y: auto; /* Adiciona scroll se o conteúdo for grande */
}
    </style>
</head>
<body>
   <div class="sidebar">
    <h2 style="text-align: center;">UnitvFree</h2>
    <a href="#" class="menu-item" onclick="render('dashboard')">Dashboard</a>
    <a href="#" class="menu-item" onclick="render('criar_admin')">Criar Admin</a>
    <a href="#" class="menu-item" onclick="render('lista_admin')">Lista de Admins</a>
    <a href="#" class="menu-item" onclick="render('criar_revendedor')">Criar Revendedor</a>
    <a href="#" class="menu-item" onclick="render('lista_revendedor')">Lista de Revendedores</a>
    <a href="#" class="menu-item" onclick="render('planos')">Planos</a>
    <a href="#" class="menu-item" onclick="render('excluidos')">Excluídos</a>
    <a href="#" class="menu-item" onclick="render('gerador')">Gerador de Códigos</a>
    <a href="#" class="menu-item" onclick="render('configuracao')">Configuração</a>
</div>

<div class="content" id="conteudo">
    <h1>Bem-vindo ao Painel</h1>
</div>
    

<script>
    // --- FUNÇÃO CENTRAL DE NAVEGAÇÃO ---
    function render(secao) {
        let c = document.getElementById('conteudo');
        
        if(secao === 'dashboard') {
            c.innerHTML = "<h1>Dashboard</h1><p>Visão geral do sistema.</p>";
        } 
        else if(secao === 'configuracao') {
            c.innerHTML = `<h1>Configuração</h1>
            <div class='card'>
                <h3>Upload Múltiplo</h3>
                <label>Nome da Pasta:</label><input type='text' id='cfg_nome'>
                <label>Arquivos .config:</label><input type='file' id='cfg_files' multiple accept='.config'>
                <button class='btn-acao' onclick='processarUploads()'>Salvar e Gerar Códigos</button>
            </div>`;
        } 
        else if(secao === 'gerador') {
            c.innerHTML = `<h1>Códigos Gerados</h1><div id='lista_codigos'></div>`;
            listarCodigosNoGerador();
        }
    }

    // --- LÓGICA DE PROCESSAMENTO ---
    function processarUploads() {
        const input = document.getElementById('cfg_files');
        const pasta = document.getElementById('cfg_nome').value;
        if(!pasta || input.files.length === 0) return alert("Preencha o nome e selecione arquivos!");

        let lista = JSON.parse(localStorage.getItem('codigos_gerados') || '[]');

        for (let i = 0; i < input.files.length; i++) {
            let codigo = Math.floor(10000000000 + Math.random() * 90000000000).toString();
            lista.push({
                codigo: codigo,
                arquivo: input.files[i].name,
                pasta: pasta,
                data: new Date().toLocaleDateString()
            });
        }
        localStorage.setItem('codigos_gerados', JSON.stringify(lista));
        alert(input.files.length + " arquivos processados!");
        render('gerador'); // Atualiza a tela
    }

    function listarCodigosNoGerador() {
        let lista = JSON.parse(localStorage.getItem('codigos_gerados') || '[]');
        let html = "<table><tr><th>Código (11 dígitos)</th><th>Arquivo</th><th>Pasta</th></tr>";
        lista.forEach(item => {
            html += `<tr><td><strong>${item.codigo}</strong></td><td>${item.arquivo}</td><td>${item.pasta}</td></tr>`;
        });
        document.getElementById('lista_codigos').innerHTML = html + "</table>";
    }
document.querySelectorAll('.menu-item').forEach(item => {
    item.addEventListener('click', function() {
        document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
        this.classList.add('active');
    });
});
</script>
</body>
</html>
