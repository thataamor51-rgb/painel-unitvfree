<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-login { background: linear-gradient(135deg, #2d0033 0%, #000000 50%, #330000 100%); }
        .hidden { display: none; }
    </style>
</head>
<body id="corpo" class="bg-login flex items-center justify-center min-h-screen">

    <!-- Tela de Login -->
    <div id="loginArea" class="bg-white p-8 rounded-3xl w-full max-w-sm shadow-2xl">
        <h2 class="text-2xl font-bold text-center text-purple-900 mb-6">Login Administrativo</h2>
        <input id="u" class="w-full p-3 mb-4 border rounded-xl" placeholder="Usuário">
        <input id="p" type="password" class="w-full p-3 mb-4 border rounded-xl" placeholder="Senha">
        <div class="mb-6"><input type="checkbox" id="captcha"> Não sou um robô</div>
        <button onclick="tentarEntrar()" class="w-full bg-red-600 text-white p-4 rounded-xl font-bold">Entrar</button>
    </div>

    <!-- Área Administrativa -->
    <div id="adminArea" class="hidden bg-black text-white w-full h-screen p-10">
        <h1 class="text-3xl font-bold text-red-500 mb-5">Painel Administrativo</h1>
        <div class="bg-gray-900 p-6 rounded-2xl">
            <input id="newU" class="p-3 text-black rounded" placeholder="Usuário do Revendedor">
            <input id="newP" class="p-3 text-black rounded" placeholder="Senha do Revendedor">
            <button onclick="salvarRevendedor()" class="bg-red-600 px-6 py-3 rounded font-bold">Salvar Revendedor</button>
        </div>
        <div id="lista" class="mt-5"></div>
    </div>

    <script>
        function tentarEntrar() {
            let u = document.getElementById('u').value.trim();
            let p = document.getElementById('p').value.trim();
            
            if(!document.getElementById('captcha').checked) {
                return alert("Marque o robô!");
            }

            // Credenciais fixas: thaissa / thaissaa
            if(u === 'thaissa' && p === 'thaissaa') {
                document.getElementById('loginArea').classList.add('hidden');
                document.getElementById('adminArea').classList.remove('hidden');
                document.getElementById('corpo').classList.remove('bg-login');
            } else {
                alert("Usuário ou senha incorretos!");
            }
        }

        function salvarRevendedor() {
            let u = document.getElementById('newU').value.trim();
            let p = document.getElementById('newP').value.trim();
            if(!u || !p) return alert("Preencha tudo!");

            let list = JSON.parse(localStorage.getItem('banco_revendas') || '[]');
            list.push({u: u, p: p});
            localStorage.setItem('banco_revendas', JSON.stringify(list));
            alert("Revendedor salvo com sucesso!");
            
            // Limpa campos
            document.getElementById('newU').value = '';
            document.getElementById('newP').value = '';
        }
    </script>
</body>
</html>
