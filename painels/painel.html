<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login Administrativo</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-[20px] shadow-lg w-80">
        <!-- Seta de Voltar -->
        <a href="index.html" class="text-gray-600 mb-4 block font-bold hover:text-gray-900">← Voltar</a>
        
        <h2 class="text-xl font-bold mb-6 text-center text-gray-700">Login Administrativo</h2>
        
        <!-- Campos fixos com valor pré-definido -->
        <input type="text" id="usuario" value="thaissa" class="w-full p-2 border border-gray-300 rounded mb-4" readonly>
        <input type="password" id="senha" value="thaissaa" class="w-full p-2 border border-gray-300 rounded mb-4" readonly>
        
        <div class="mb-4 text-sm text-gray-600">
            <input type="checkbox" id="lembrarSenha"> Salvar senha
        </div>
        
        <div class="mb-4 text-sm text-gray-600">
            <input type="checkbox" id="captcha"> Não sou um robô
        </div>
        
        <button onclick="verificarLogin()" class="w-full bg-red-500 text-white p-3 rounded-lg font-bold hover:bg-red-600 transition">Entrar</button>

        <!-- Novos Links de Suporte -->
        <div class="mt-6 text-center text-[11px] text-gray-500 space-y-2">
            <div>
                <a href="#" class="hover:underline">Esqueci minha senha</a> | 
                <a href="#" class="hover:underline">Suporte Técnico</a>
            </div>
            <div>
                <a href="#" class="hover:underline">Status do Servidor</a>
            </div>
        </div>
    </div>

    <script>
        function verificarLogin() {
            // Valores fixos conforme solicitado
            const u = "thaissa";
            const p = "thaissaa";
            const inputU = document.getElementById("usuario").value;
            const inputP = document.getElementById("senha").value;
            const lembrar = document.getElementById("lembrarSenha").checked;

            if (inputU === u && inputP === p) {
                if (lembrar) {
                    localStorage.setItem("usuarioSalvo", inputU);
                    localStorage.setItem("senhaSalva", inputP);
                } else {
                    localStorage.removeItem("usuarioSalvo");
                    localStorage.removeItem("senhaSalva");
                }
                alert("Login efetuado com sucesso!");
                window.location.href = "painel_interno.html"; // Ajuste o link conforme seu arquivo
            } else {
                alert("Usuário ou senha incorretos.");
            }
        }
    </script>
</body>
</html>
