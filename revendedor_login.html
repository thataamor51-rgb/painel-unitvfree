<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Revendedor</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Fundo gradiente conforme a segunda imagem */
            background: linear-gradient(135deg, #4a90e2, #9b59b6);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-container {
            /* Caixa branca centralizada */
            background-color: #ffffff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 350px;
            text-align: center;
        }
        .login-container h2 {
            margin-bottom: 25px;
            color: #333;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .checkbox-group {
            text-align: left;
            margin-bottom: 20px;
            font-size: 0.9em;
            color: #666;
        }
        button {
            width: 100%;
            padding: 12px;
            /* Cor rosa solicitada */
            background-color: #ff69b4;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #ff85c1;
        }
        .voltar {
            display: block;
            margin-bottom: 15px;
            text-align: left;
            color: #ff69b4;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="login-container">
    <a href="#" class="voltar">← Voltar</a>
    <h2>Login Revendedor</h2>
    <form>
        <div class="input-group">
            <input type="text" placeholder="Usuário" required>
        </div>
        <div class="input-group">
            <input type="password" placeholder="Senha" required>
        </div>
        <div class="checkbox-group">
            <input type="checkbox" id="salvar">
            <label for="salvar">Salvar login</label>
        </div>
        <button type="submit">Entrar</button>
    </form>
</div>

</body>
</html>
